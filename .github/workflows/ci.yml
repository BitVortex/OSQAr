name: Tests and Example Shipments

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --with evidence

    - name: Run repository acceptance tests
      run: poetry run python -m pytest -q tests

    - name: Framework regression and fault-injection tests
      run: |
        set -euo pipefail
        poetry run python -m pytest -q tests \
          --junitxml=framework-test-results.xml \
          --cov=tools \
          --cov-report=xml:framework-coverage.xml
        poetry run python -m tools.framework_test_report \
          framework-test-results.xml \
          --json-report framework-test-validation.json

    - name: Prove framework evidence validator fails closed
      run: |
        set -euo pipefail
        printf '%s\n' '<testsuite tests="1" failures="0" errors="0" skipped="1"><testcase name="seeded-skip"><skipped/></testcase></testsuite>' > seeded-skipped.xml
        printf '%s\n' '<testsuites tests="0" failures="0" errors="0" skipped="0"/>' > seeded-zero.xml
        if poetry run python -m tools.framework_test_report seeded-skipped.xml; then
          echo "ERROR: skipped-test JUnit evidence was accepted" >&2
          exit 1
        else
          status=$?
          test "${status}" -eq 2
        fi
        if poetry run python -m tools.framework_test_report seeded-zero.xml; then
          echo "ERROR: zero-collection JUnit evidence was accepted" >&2
          exit 1
        else
          status=$?
          test "${status}" -eq 2
        fi

    - name: Upload source framework evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: framework-evidence-source-python-${{ matrix.python-version }}
        path: |
          framework-test-results.xml
          framework-test-validation.json
          framework-coverage.xml
        retention-days: 30

    - name: Build and test installed wheel
      run: |
        set -euo pipefail
        python -m pip install build
        python -m build --wheel
        rm -rf /tmp/osqar-wheel /tmp/osqar-installed-suite
        python -m venv /tmp/osqar-wheel
        /tmp/osqar-wheel/bin/python -m pip install --upgrade pip
        /tmp/osqar-wheel/bin/python -m pip install dist/osqar-*.whl pytest pytest-cov
        mkdir -p /tmp/osqar-installed-suite/.github/workflows
        cp -R tests docs skills tools /tmp/osqar-installed-suite/
        mkdir -p /tmp/osqar-installed-suite/osqar_data
        cp -R osqar_data/templates /tmp/osqar-installed-suite/osqar_data/templates
        cp index.rst pyproject.toml conf.py /tmp/osqar-installed-suite/
        cp .github/workflows/ci.yml .github/workflows/release.yml /tmp/osqar-installed-suite/.github/workflows/
        rm /tmp/osqar-installed-suite/tools/__init__.py
        (cd /tmp/osqar-installed-suite && /tmp/osqar-wheel/bin/python -m pytest -q -m "not source_checkout" tests \
          --junitxml=$GITHUB_WORKSPACE/installed-wheel-test-results.xml \
          --cov=tools \
          --cov-report=xml:$GITHUB_WORKSPACE/installed-wheel-coverage.xml)
        (cd /tmp && /tmp/osqar-wheel/bin/python -m tools.framework_test_report \
          $GITHUB_WORKSPACE/installed-wheel-test-results.xml \
          --json-report $GITHUB_WORKSPACE/installed-wheel-test-validation.json)
        (cd /tmp && /tmp/osqar-wheel/bin/python -c 'import importlib.resources; import pathlib; import tools; import osqar_data; source_checkout = pathlib.Path("'"$GITHUB_WORKSPACE"'").resolve(); wheel_root = pathlib.Path("/tmp/osqar-wheel").resolve(); module_paths = [pathlib.Path(tools.__file__).resolve(), pathlib.Path(osqar_data.__file__).resolve()]; resource_path = pathlib.Path(str(importlib.resources.files(osqar_data))).resolve(); assert all(path.is_relative_to(wheel_root) and not path.is_relative_to(source_checkout) for path in [*module_paths, resource_path]), (module_paths, resource_path)')
        (cd /tmp && /tmp/osqar-wheel/bin/osqar --help >/dev/null)
        (cd /tmp && /tmp/osqar-wheel/bin/osqar traceability --help >/dev/null)
        (cd /tmp && /tmp/osqar-wheel/bin/osqar shipment --help >/dev/null)

    - name: Upload installed-wheel framework evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: framework-evidence-wheel-python-${{ matrix.python-version }}
        path: |
          installed-wheel-test-results.xml
          installed-wheel-test-validation.json
          installed-wheel-coverage.xml
        retention-days: 30

    - name: Sanity-check osqar CLI entrypoint
      run: |
        set -euo pipefail
        chmod +x ./osqar
        ./osqar --help
        ./osqar doctor --help

    - name: Build documentation
      run: |
        # Generate example JUnit XML first (otherwise the Sphinx build would
        # fall back to the placeholder 0-tests report).
        pushd examples/python_hello_world >/dev/null
        rm -f coverage_report.txt coverage.xml
        poetry run pytest -q \
          --junitxml=test_results.xml \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          tests/test_tsim.py
        poetry run coverage report -m > coverage_report.txt
        popd >/dev/null

        # Build the Python demo example docs
        poetry run sphinx-build -b html examples/python_hello_world examples/python_hello_world/_build/html

    - name: Traceability checks (needs.json)
      run: |
        test -f examples/python_hello_world/_build/html/needs.json
        chmod +x ./osqar
        ./osqar traceability \
          examples/python_hello_world/_build/html/needs.json \
          --json-report examples/python_hello_world/_build/html/traceability_report.json

    - name: Generate checksums for documentation dump
      run: |
        chmod +x ./osqar
        ./osqar checksum generate \
          --root examples/python_hello_world/_build/html \
          --output examples/python_hello_world/_build/html/SHA256SUMS
        ./osqar checksum verify \
          --root examples/python_hello_world/_build/html \
          --manifest examples/python_hello_world/_build/html/SHA256SUMS

    - name: Exercise new commands (impact, CSV, XLSX, workspace combine, gsn)
      run: |
        set -euo pipefail
        chmod +x ./osqar

        # Impact analysis
        echo "== osqar impact"
        ./osqar impact examples/python_hello_world/_build/html/needs.json \
          --need-id ARCH_001 --direction downstream

        # CSV traceability matrix export
        echo "== osqar traceability --format csv"
        ./osqar traceability examples/python_hello_world/_build/html/needs.json \
          --format csv --format-output examples/python_hello_world/_build/html/traceability_matrix.csv \
          --test-prefix TEST_ --code-prefix CODE_
        test -s examples/python_hello_world/_build/html/traceability_matrix.csv

        # XLSX (Excel) traceability matrix export
        echo "== osqar traceability --format xlsx"
        ./osqar traceability examples/python_hello_world/_build/html/needs.json \
          --format xlsx --format-output examples/python_hello_world/_build/html/traceability_matrix.xlsx \
          --test-prefix TEST_ --code-prefix CODE_
        test -s examples/python_hello_world/_build/html/traceability_matrix.xlsx

        # Workspace combine + traceability (auto-discovers example projects)
        echo "== osqar workspace combine"
        ./osqar workspace combine --root examples --output _build/workspace/needs.json
        test -s _build/workspace/needs.json
        ./osqar workspace traceability --needs-json _build/workspace/needs.json \
          --json-report _build/workspace/traceability_report.json

        # GSN generate — PlantUML backend (default)
        echo "== osqar gsn generate (PlantUML)"
        ./osqar gsn generate examples/python_hello_world/_build/html/needs.json \
          --output _build/gsn_safety_case.puml
        # Verify output is valid PlantUML
        test -s _build/gsn_safety_case.puml
        grep -q '@startuml' _build/gsn_safety_case.puml
        grep -q '@enduml' _build/gsn_safety_case.puml

        # GSN generate — gsn2x-yaml backend (legacy)
        echo "== osqar gsn generate (gsn2x-yaml)"
        ./osqar gsn generate examples/python_hello_world/_build/html/needs.json \
          --backend gsn2x-yaml --output _build/gsn_safety_case.yaml
        test -s _build/gsn_safety_case.yaml

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation-${{ matrix.python-version }}
        path: examples/python_hello_world/_build/html/
        retention-days: 30

  python-example-e2e:
    name: Python example (E2E)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --with evidence

    - name: Run Temperature Monitor (TSIM) example
      run: |
        cd examples/python_hello_world
        chmod +x build-and-test.sh
        ./build-and-test.sh

    - name: Verify documentation build
      run: |
        cd examples/python_hello_world
        ls -la _build/html/index.html
        test -f _build/html/05_test_results.html

    - name: Traceability checks (needs.json)
      run: |
        test -f examples/python_hello_world/_build/html/needs.json
        chmod +x ./osqar
        ./osqar traceability \
          examples/python_hello_world/_build/html/needs.json \
          --json-report examples/python_hello_world/_build/html/traceability_report.json

    - name: Generate checksums for documentation dump
      run: |
        chmod +x ./osqar
        ./osqar checksum generate \
          --root examples/python_hello_world/_build/html \
          --output examples/python_hello_world/_build/html/SHA256SUMS
        ./osqar checksum verify \
          --root examples/python_hello_world/_build/html \
          --manifest examples/python_hello_world/_build/html/SHA256SUMS

    - name: Upload Python example artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-example-e2e
        path: |
          examples/python_hello_world/_build/html/
          examples/python_hello_world/test_results.xml
          examples/python_hello_world/coverage_report.txt
          examples/python_hello_world/coverage.xml
        retention-days: 30

  bazel-example-shipment:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [c_shared_lib, c_hello_world, cpp_hello_world, rust_hello_world]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          build-essential \
          default-jre-headless \
          graphviz \
          plantuml

    - name: Set up Bazelisk
      uses: bazelbuild/setup-bazelisk@v3
      with:
        bazelisk-version: "1.20.0"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --with evidence

    - name: Build reproducible Bazel shipment (${{ matrix.example }})
      run: |
        set -euo pipefail
        export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"

        ex_dir="examples/${{ matrix.example }}"
        ship_root="_ci_shipments"
        ship_dir="${ship_root}/${{ matrix.example }}"
        out="osqar_${{ matrix.example }}_shipment.zip"

        rm -rf "${ship_root}"
        mkdir -p "${ship_dir}/implementation" "${ship_dir}/tests" "${ship_dir}/reports"

        echo "== Building ${ex_dir} (Bazel, reproducible)"
        pushd "${ex_dir}" >/dev/null
        chmod +x ./bazel-build-and-test.sh

        # Native build + test report
        OSQAR_REPRODUCIBLE=1 ./bazel-build-and-test.sh

        # Coverage evidence (best-effort)
        rm -f coverage_report.txt coverage.xml
        case "${{ matrix.example }}" in
          c_shared_lib)
            rm -rf _coverage_build
            mkdir -p _coverage_build
            cc --coverage -O0 -g -Iinclude -c src/osqar_shared.c -o _coverage_build/osqar_shared.o
            cc --coverage -O0 -g -Iinclude -c tests/test_osqar_shared.c -o _coverage_build/test_osqar_shared.o
            cc --coverage -o _coverage_build/junit_tests _coverage_build/osqar_shared.o _coverage_build/test_osqar_shared.o
            ./_coverage_build/junit_tests test_results.xml
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --print-summary > coverage_report.txt 2>&1 || true
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --xml-pretty -o coverage.xml >/dev/null 2>&1 || true
            ;;
          c_hello_world)
            # Build with GCC coverage instrumentation (separate from Bazel build)
            rm -rf _coverage_build
            mkdir -p _coverage_build
            cc --coverage -O0 -g -Iinclude -I../c_shared_lib/include -c ../c_shared_lib/src/osqar_shared.c -o _coverage_build/osqar_shared.o
            cc --coverage -O0 -g -Iinclude -I../c_shared_lib/include -c src/tsim.c -o _coverage_build/tsim.o
            cc --coverage -O0 -g -Iinclude -I../c_shared_lib/include -c tests/test_tsim.c -o _coverage_build/test_tsim.o
            cc --coverage -o _coverage_build/junit_tests _coverage_build/osqar_shared.o _coverage_build/tsim.o _coverage_build/test_tsim.o
            ./_coverage_build/junit_tests test_results.xml
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --print-summary > coverage_report.txt 2>&1 || true
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --xml-pretty -o coverage.xml >/dev/null 2>&1 || true
            ;;
          cpp_hello_world)
            rm -rf _coverage_build
            mkdir -p _coverage_build
            cc --coverage -O0 -g -I../c_shared_lib/include -c ../c_shared_lib/src/osqar_shared.c -o _coverage_build/osqar_shared.o
            c++ --coverage -O0 -g -Iinclude -I../c_shared_lib/include -c src/tsim.cpp -o _coverage_build/tsim.o
            c++ --coverage -O0 -g -Iinclude -I../c_shared_lib/include -c tests/test_tsim.cpp -o _coverage_build/test_tsim.o
            c++ --coverage -o _coverage_build/junit_tests _coverage_build/osqar_shared.o _coverage_build/tsim.o _coverage_build/test_tsim.o
            ./_coverage_build/junit_tests test_results.xml
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --print-summary > coverage_report.txt 2>&1 || true
            poetry run gcovr -r . --object-directory _coverage_build --exclude 'tests/.*' --xml-pretty -o coverage.xml >/dev/null 2>&1 || true
            ;;
          rust_hello_world)
            # Cargo-based coverage (implementation A). Bazel remains available as an alternative build path.
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              # shellcheck source=/dev/null
              source "$HOME/.cargo/env"
            else
              # shellcheck source=/dev/null
              source "$HOME/.cargo/env" 2>/dev/null || true
            fi

            rustup component add llvm-tools-preview >/dev/null 2>&1 || true
            cargo install cargo-llvm-cov --locked >/dev/null 2>&1 || true

            # Exercise the same test binary under coverage instrumentation.
            cargo llvm-cov run --locked --release --bin junit_tests -- test_results.xml >/dev/null 2>&1 || true
            cargo llvm-cov report --locked --release --summary-only > coverage_report.txt 2>&1 || true
            cargo llvm-cov report --locked --release --cobertura --output-path coverage.xml >/dev/null 2>&1 || true
            ;;
        esac

        if [ ! -f coverage_report.txt ]; then
          echo "Coverage report not generated." > coverage_report.txt
        fi

        # Docs build (imports test_results.xml)
        rm -rf _build/html
        poetry run sphinx-build -b html . _build/html

        # Ensure test report is shipped alongside the HTML evidence directory
        cp -f test_results.xml _build/html/test_results.xml

        # Ensure coverage evidence is shipped alongside the HTML evidence directory
        cp -f coverage_report.txt _build/html/coverage_report.txt
        if [ -f coverage.xml ]; then
          cp -f coverage.xml _build/html/coverage.xml
        fi
        popd >/dev/null

        # Assemble a full evidence bundle (docs + implementation + tests + reports)
        cp -a "${ex_dir}/_build/html/." "${ship_dir}/"

        if [ -d "${ex_dir}/src" ]; then
          mkdir -p "${ship_dir}/implementation/src"
          cp -a "${ex_dir}/src/." "${ship_dir}/implementation/src/"
        fi
        if [ -d "${ex_dir}/include" ]; then
          mkdir -p "${ship_dir}/implementation/include"
          cp -a "${ex_dir}/include/." "${ship_dir}/implementation/include/"
        fi
        if [ -d "${ex_dir}/tests" ]; then
          mkdir -p "${ship_dir}/tests"
          cp -a "${ex_dir}/tests/." "${ship_dir}/tests/"
        fi

        # Keep key build descriptors for review/reproduction
        for f in CMakeLists.txt Cargo.toml Cargo.lock BUILD.bazel MODULE.bazel .bazelrc build-and-test.sh bazel-build-and-test.sh; do
          if [ -f "${ex_dir}/${f}" ]; then
            cp -a "${ex_dir}/${f}" "${ship_dir}/implementation/"
          fi
        done

        # Analysis/verification reports
        for f in test_results.xml coverage_report.txt coverage.xml complexity_report.txt; do
          if [ -f "${ex_dir}/${f}" ]; then
            cp -a "${ex_dir}/${f}" "${ship_dir}/reports/"
          fi
        done

        # Supplier metadata (shipped)
        if [ -f "${ex_dir}/osqar_project.json" ]; then
          cp -a "${ex_dir}/osqar_project.json" "${ship_dir}/osqar_project.json"
        fi

        chmod +x ./osqar

        # Traceability report for the shipped docs
        ./osqar traceability \
          "${ship_dir}/needs.json" \
          --json-report "${ship_dir}/traceability_report.json"

        # Bundle integrity: checksums over the full bundle directory
        ./osqar checksum generate --root "${ship_dir}" --output "${ship_dir}/SHA256SUMS"
        ./osqar checksum verify --root "${ship_dir}" --manifest "${ship_dir}/SHA256SUMS"

        rm -f "${out}" "${out}.sha256"
        ./osqar shipment package --shipment "${ship_dir}" --output "${out}"
        sha256sum "${out}" > "${out}.sha256"

    - name: Upload shipment archive (${{ matrix.example }})
      uses: actions/upload-artifact@v4
      with:
        name: osqar-example-shipment-${{ matrix.example }}
        path: |
          osqar_${{ matrix.example }}_shipment.zip
          osqar_${{ matrix.example }}_shipment.zip.sha256
        retention-days: 30

  example-workspace:
    runs-on: ubuntu-24.04
    needs: bazel-example-shipment
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install

    - name: Download per-example shipments
      uses: actions/download-artifact@v4
      with:
        pattern: osqar-example-shipment-*
        path: _ci_per_example
        merge-multiple: true

    - name: Create combined workspace (intake + package ZIP)
      run: |
        set -euo pipefail
        export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"

        chmod +x ./osqar

        rm -rf _ci_shipments
        mkdir -p _ci_shipments

        for a in _ci_per_example/osqar_*_shipment.zip; do
          unzip -q "${a}" -d _ci_shipments
        done

        ws_root="_ci_workspace/osqar-example-workspace"
        rm -rf "${ws_root}"
        mkdir -p _ci_workspace

        ./osqar workspace intake \
          --root _ci_shipments \
          --recursive \
          --output "${ws_root}" \
          --force \
          --traceability \
          --doctor \
          --enforce-deps

        out="osqar_example_workspace.zip"
        rm -f "${out}" "${out}.sha256"
        ./osqar shipment package --shipment "${ws_root}" --output "${out}"
        sha256sum "${out}" > "${out}.sha256"

    - name: Upload example workspace (combined)
      uses: actions/upload-artifact@v4
      with:
        name: osqar-example-workspace
        path: |
          osqar_example_workspace.zip
          osqar_example_workspace.zip.sha256
        retention-days: 30